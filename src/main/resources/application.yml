server:
  port: 8080
  servlet:
    context-path: /

jwt:
  #  secret: a-very-long-and-random-secret-key-that-should-be-at-least-256-bit
  secret: 'SvDemoTest'
  access-token-validity: 900000      # 15分钟
  refresh-token-validity: 604800000  # 7天
  refresh-grace-period: 900000       # 15分钟宽限


spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true
#      additional-paths: src/main/java
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
#    url: jdbc:mysql://localhost:3306
    url: jdbc:mariadb://localhost:3306/sv_demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UT
    username: root
    password: 123
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  # 如果将来有XML文件，配置映射文件位置
  # mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 在控制台打印SQL（开发环境开启）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 全局逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

upload:
  allowed-extensions:
    - doc
    - docx
    - gif
    - jpg
    - jpeg
    - png
    - pdf
    - xlsx
    - xls
    - txt
  default-max-size: 10485760  # 10MB
  extension-max-size:
    xlsx: 52428800            # 50MB
    pdf: 20971520             # 20MB
    mp4: 1073741824           # 1GB
  upload-dir: E:\Project\sv-demo\src\main\resources\uploadFile

