server:
  port: 8080
  servlet:
    context-path: /

jwt:
  # 生产用环境变量 JWT_SECRET 注入；下面默认值仅供本地调试，长度需 >=32 字节以满足 HMAC256
  secret: ${JWT_SECRET:sv-demo-dev-only-secret-key-please-override-in-production-0123456789}
#  secret: 'SvDemoTest'
  access-token-validity: 900000      # 15分钟
  refresh-token-validity: 604800000  # 7天
  refresh-grace-period: 900000       # 15分钟宽限


spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true
#      additional-paths: src/main/java
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
#    url: jdbc:mysql://localhost:3306
    url: jdbc:mariadb://localhost:3306/sv_demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true
    username: root
    password: 123
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2               # 至少保持 2 个空闲连接
          time-between-eviction-runs: 10s   # 每 10 秒检测一次空闲连接

mybatis-plus:
  # 配置XML映射文件位置
#  mapper-locations: classpath*:/mapper/**/*.xml
  mapper-locations: classpath*:org/goden/svdemo/mapper/xml/*.xml
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 在控制台打印SQL（开发环境开启）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      # ID生成策略-雪花算法
      # id-type: assign_id
      # 全局更新策略:null 跳过,空串照常更新,如("")
      update-strategy: not_null
      # 插入策略:null 跳过,空串照常插入
      insert-strategy: not_null
      # 全局逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.goden.svdemo.controller

# http://127.0.0.1:8080/doc.html
# http://ip:port/doc.html
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  openapi:
    title: sv-demo接口文档
    description: sv-demo接口文档
    version: 1.0.0
  setting:
    language: zh_cn

upload:
  allowed-extensions:
    - doc
    - docx
    - gif
    - jpg
    - jpeg
    - png
    - pdf
    - xlsx
    - xls
    - txt
  default-max-size: 10485760  # 10MB
  extension-max-size:
    xlsx: 52428800            # 50MB
    pdf: 20971520             # 20MB
    mp4: 1073741824           # 1GB
  upload-dir: E:\Project\sv-demo\src\main\resources\uploadFile

auth:
  cookie:
    secure: false      # 本地 http 调试；上 HTTPS 后改 true
    same-site: Lax     # 前后端不同域 → 改 None，且 secure 必须 true
    path: /user        # 必须同时覆盖 /user/refresh 和 /user/logout

